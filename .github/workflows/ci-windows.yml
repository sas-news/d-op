name: CI Windows (Chromium fixture)

# Task 5 Windows companion: install, typecheck, build, unit, and the
# Chromium fixture E2E to catch path/runtime incompatibilities. Full-matrix
# lint/worker/Firefox coverage runs on Linux (see ci.yml). No signing,
# store publishing, or production deployment happens here.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # task 25: unit tests read historical tags (v1.0.0)

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install with lockfile enforcement
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: E2E Chromium fixture
        run: bun run test:e2e -- --project=web-chromium harness.spec.ts

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-5-evidence-windows
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
