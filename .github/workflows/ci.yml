name: CI (Linux full matrix)

# Task 5 non-publishing CI: install, typecheck, lint, build, unit, worker,
# Playwright E2E (all configured projects), and the test-origin artifact check.
# No signing, store publishing, or production deployment happens here; the
# release workflow is frozen (see release.yml, task 25 owns it).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install with lockfile enforcement
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Worker tests (workerd/D1)
        run: bun run test:worker

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: E2E tests
        run: bun run test:e2e

      - name: Test-origin artifact check
        run: bun run check:test-origins

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-5-evidence-linux
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
