name: Release (frozen by task 5)

# Task 5 freeze: ordinary main pushes must not delete/recreate tags, create
# releases, sign binaries, publish stores, or deploy production. The legacy
# packaging flow below is disabled until task 25 defines the v2 release
# procedure (immutable tags, AMO source ZIP, store publishing checklist).
# This workflow runs only on manual dispatch and always stops loudly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse release while v2 procedure is undefined
        run: |
          echo "::error::v2 release is frozen (task 5). Task 25 owns the release workflow; no tags, artifacts, signing, publishing, or deployment may run from here."
          exit 1
